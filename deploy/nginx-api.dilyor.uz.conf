# /etc/nginx/sites-available/api.dilyor.uz
# Vercel serves the site and proxies /api and /uploads here.
# Certbot adds the TLS block and the :80 redirect.
server {
    listen 80;
    listen [::]:80;
    server_name api.dilyor.uz;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # uploaded images: never let a browser sniff them into something runnable
    location /uploads/ {
        proxy_pass http://127.0.0.1:8790/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        expires 30d;
    }
}
